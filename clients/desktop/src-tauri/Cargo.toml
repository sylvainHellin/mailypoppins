[package]
name = "mp-desktop"
version = "0.1.0"
description = "mailypoppins desktop client"
authors = ["Sylvain Hellin"]
license = "MIT"
publish = false
edition = "2021"

# Standalone: the root workspace excludes clients/desktop so cargo test --workspace never builds Tauri.
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.6"
tauri-plugin-shell = "2.4"
# The native file and folder pickers of the Save and Attach file dialogs (JS side).
tauri-plugin-dialog = "2.8"
mp-client = { path = "../../../crates/mp-client" }
mp-protocol = { path = "../../../crates/mp-protocol" }
mp-core = { path = "../../../crates/mp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
portable-pty = "0.9.0"

# The press-and-hold default (src/lib.rs `key_repeat`); already in the tree
# through tao and wry, at this version.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSObject", "NSString", "NSUserDefaults", "NSValue"] }

# TypeScript bindings for the result and event types (src/ts_bindings.rs). A
# dev-dependency with `cfg_attr(test, ...)` derives, so a plain `cargo test`
# runs the stale check and the app build never compiles ts-rs; mp-protocol's
# `ts` feature gives the wire types these embed their `TS` impls.
[dev-dependencies]
ts-rs = { version = "12", features = ["serde-compat"] }
mp-protocol = { path = "../../../crates/mp-protocol", features = ["ts"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
