# Release pipeline (ticket #0011).
#
# On every `v*` tag push:
#   1. create a GitHub release for the tag, with notes extracted from
#      the matching `## [X.Y.Z]` section of CHANGELOG.md;
#   2. build release binaries for macOS (arm64) and Linux
#      (x86_64 gnu + static musl) and upload them as
#      `mailypoppins-<target>.tar.gz` plus `.sha256` checksums;
#   3. build the desktop app for macOS (arm64) with the matching
#      `mp` inside it as a sidecar, and upload
#      `mailypoppins-desktop-<target>.dmg` and `.app.tar.gz` plus `.sha256`
#      checksums (ticket #0132; unsigned until #0012).
#
# See docs/release-process.md for the full release procedure.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "::warning::No '## [$version]' section in CHANGELOG.md; release notes will be empty."
          fi
          # GitHub caps release bodies at 125000 characters; truncate at a
          # line boundary and point at the changelog for the rest.
          max=120000
          if [ "$(wc -c < /tmp/notes.md)" -gt "$max" ]; then
            awk -v max="$max" '{ total += length($0) + 1; if (total > max) exit; print }' \
              /tmp/notes.md > /tmp/notes-truncated.md
            printf '\n*Notes truncated; see [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for the full section.*\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> /tmp/notes-truncated.md
            mv /tmp/notes-truncated.md /tmp/notes.md
            echo "::warning::Release notes exceeded ${max} characters and were truncated."
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is arm64. No Intel macOS build: an Intel Mac
          # builds from source with `cargo install --path .`. macOS TLS
          # goes through Security.framework, no OpenSSL.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Static binary with vendored OpenSSL; this is the artifact the
          # Homebrew formula uses on Linux (zero runtime dependencies).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: vendored-openssl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: mp
          target: ${{ matrix.target }}
          archive: mailypoppins-$target
          features: ${{ matrix.features }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # The desktop app (ticket #0132): `pnpm bundle` in clients/desktop builds
  # `mp` for the target, stages it as the `bundle.externalBin` sidecar
  # (src-tauri/binaries/mp-<target>, which the bundler installs as
  # Contents/MacOS/mp), and runs `tauri build` with the bundle's version set
  # to mp's. Plain `tauri build` rather than tauri-apps/tauri-action: the
  # release already exists with the changelog notes, the sidecar has to be
  # staged first anyway, the asset names stay ours (the cask template in
  # packaging/homebrew/ relies on them), and Tauri's bundler reads the Apple
  # signing and notarization variables itself, so signing needs no action.
  # Not a dependency of homebrew-tap: the formula is the CLI's.
  desktop-macos:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # 22.18 or later runs the .ts scripts directly.
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the app bundle and DMG with the mp sidecar
        # ---- Signing and notarization: #0012 --------------------------------
        # Unsigned for now. Once the Developer ID certificate exists, add these
        # repository secrets and uncomment the env block; `tauri build` then
        # imports the certificate into a temporary keychain, signs the app and
        # the sidecar, notarizes and staples, with no other change here:
        #   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
        #   APPLE_CERTIFICATE_PASSWORD  the .p12's export password
        #   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
        #   APPLE_ID                    the Apple account's email, for notarytool
        #   APPLE_PASSWORD              an app-specific password of that account
        #   APPLE_TEAM_ID               the 10-character team id
        # Then drop the "unsigned" note in docs/release-process.md and publish
        # the cask (packaging/homebrew/mailypoppins-app.rb.tmpl).
        # env:
        #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # ---------------------------------------------------------------------
        run: pnpm bundle --target ${{ matrix.target }} -- --ci --bundles app,dmg
      - name: Upload the DMG and the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          bundle="src-tauri/target/$TARGET/release/bundle"
          out="$RUNNER_TEMP/desktop"
          mkdir -p "$out"
          dmg=$(ls "$bundle"/dmg/*.dmg)
          cp "$dmg" "$out/mailypoppins-desktop-$TARGET.dmg"
          tar -czf "$out/mailypoppins-desktop-$TARGET.app.tar.gz" -C "$bundle/macos" mailypoppins.app
          cd "$out"
          for f in mailypoppins-desktop-$TARGET.dmg mailypoppins-desktop-$TARGET.app.tar.gz; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            mailypoppins-desktop-$TARGET.dmg mailypoppins-desktop-$TARGET.dmg.sha256 \
            mailypoppins-desktop-$TARGET.app.tar.gz mailypoppins-desktop-$TARGET.app.tar.gz.sha256

  # Update the Homebrew tap (ticket #0013). Requires the TAP_DEPLOY_KEY
  # repository secret: the PRIVATE half of an ed25519 deploy key whose
  # PUBLIC half is registered (with write access) on
  # sylvainHellin/homebrew-mailypoppins. Auth is over SSH via ssh-agent;
  # no PAT is involved. Skipped with a notice (not a failure) until the
  # tap repo + key exist -- see docs/release-process.md for the one-time
  # setup.
  homebrew-tap:
    needs: upload-assets
    runs-on: ubuntu-latest
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - name: Skip when TAP_DEPLOY_KEY is not configured
        if: env.TAP_DEPLOY_KEY == ''
        run: echo "::notice::TAP_DEPLOY_KEY not set; skipping Homebrew tap update."
      - uses: actions/checkout@v4
        if: env.TAP_DEPLOY_KEY != ''
      - name: Load tap deploy key into ssh-agent
        if: env.TAP_DEPLOY_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - name: Render formula from release checksums
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME#v}" > /tmp/mailypoppins.rb
          cat /tmp/mailypoppins.rb
      - name: Push formula to tap repository
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          git clone "git@github.com:sylvainHellin/homebrew-mailypoppins.git" tap
          mkdir -p tap/Formula
          cp /tmp/mailypoppins.rb tap/Formula/mailypoppins.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mailypoppins.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to push."
          else
            git commit -m "mailypoppins ${GITHUB_REF_NAME}"
            git push
          fi
