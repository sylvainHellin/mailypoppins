[package]
name = "mp-core"
version = "0.1.0"
edition = "2021"
description = "Engine-free shared modules of mailypoppins: configuration, secrets, parsing, types"
authors = ["Sylvain Hellin"]

[lib]
name = "mp_core"
path = "src/lib.rs"

[features]
# The test seams the root crate's own tests need. `#[cfg(test)]` does not cross
# a crate boundary: a dependency is compiled without it, so the thread-local
# data-dir overrides (`config::test_env`) and the per-thread materialisation
# root (`parse::test_temp_root`) would vanish the moment these modules stopped
# being part of the root crate. The root crate turns the feature on through its
# `[dev-dependencies]` entry, which resolver v2 keeps out of a plain
# `cargo build` / `cargo install`, so the shipped binary compiles exactly the
# code `#[cfg(test)]` used to leave out.
test-support = ["dep:tempfile"]

[dependencies]
# Versions are the root crate's, unchanged: the workspace resolves one copy of
# each and the lock file does not move.
anyhow = "1.0"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = "0.4"
chrono-tz = "0.10"
colored = "2.1"
dirs = "5"
hkdf = "0.12"
html2text = { version = "0.14", features = ["css"] }
icalendar = "0.17"
keyring = { version = "3", features = ["apple-native", "linux-native"] }
log = "0.4"
machine-uid = "0.5"
mailparse = "0.15"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shellexpand = "3.1"
# Only for `config::test_env`'s `TestDataDir`, behind `test-support`.
tempfile = { version = "3", optional = true }
# `simplelog`'s custom timestamp format, in `config::init_file_logging`.
time = { version = "0.3", features = ["macros"] }
simplelog = "0.12"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
# `types` re-exports the calendar frontmatter structs the daemon protocol owns
# (P5-U10, #0124), so the YAML sidecar and the wire agree by construction.
mp-protocol = { path = "../mp-protocol" }
# `contacts::matcher`, the fuzzy address completion the TUI and `mp contacts`
# both drive.
nucleo-matcher = "0.3"
# `draft`: the YAML frontmatter parser and the drafts-directory walk.
gray_matter = "0.2"
walkdir = "2"
# `draft::validate_draft` only parses an address with `message::Mailbox`, so
# the transports and their TLS stacks are off: what it asserts is that the
# string the send path will hand lettre is one lettre accepts.
lettre = { version = "0.11", default-features = false, features = ["builder"] }

[dev-dependencies]
tempfile = "3"
