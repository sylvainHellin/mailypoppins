[package]
name = "mp-client"
version = "0.1.0"
edition = "2021"
description = "Client transport for the mailypoppins daemon protocol"
authors = ["Sylvain Hellin"]

[lib]
name = "mp_client"
path = "src/lib.rs"

[dependencies]
mp-protocol = { path = "../mp-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
# The session kernel lifted from `clients/tui` (`session`, `events`,
# `queries`): its public API answers `anyhow::Result` and logs its connect and
# reconnect, as it did in the TUI. Same versions as the root crate.
anyhow = "1.0"
log = "0.4"
# The outbox listing renders a unix timestamp in local time, which is a
# formatting decision and therefore the client's (`outbox_cli_lines`). Same
# version as the root crate, so the workspace resolves one chrono.
chrono = "0.4"
# `queries::message_ics` decodes the base64 the wire carries a blob in. Same
# version as the root crate and `mp-core`, so the lock file does not move.
base64 = "0.22"

[features]
# `Session::serving`, the in-process session a test drives over a dispatcher.
# `#[cfg(test)]` does not cross a crate boundary, so `mp-tui`'s own
# `test-support` turns this on; resolver v2 keeps it out of a shipped `mp`.
test-support = []
