[workspace]
members = [".", "crates/mp-protocol", "crates/mp-client"]
# The Phase 1a spike carries its own `[workspace]` and its own lock file; the
# desktop shell (Phase 6) will be a separate build system.
exclude = ["spikes/*", "desktop"]

[package]
name = "mailypoppins"
version = "0.9.0"
edition = "2021"
description = "A CLI tool for sending emails from Markdown drafts with YAML frontmatter"
authors = ["Sylvain Hellin"]

[lib]
name = "mailypoppins"
path = "src/lib.rs"

[[bin]]
name = "mp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lettre = { version = "0.11", features = ["smtp-transport", "tokio1-native-tls", "builder"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
gray_matter = "0.2"
pulldown-cmark = "0.9"
anyhow = "1.0"
keyring = { version = "3", features = ["apple-native", "linux-native"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
machine-uid = "0.5"
rand = "0.8"
chrono = "0.4"
walkdir = "2.4"
colored = "2.1"
tokio = { version = "1", features = ["full"] }
shellexpand = "3.1"
dirs = "5"
toml = "0.8"
mime_guess = "2"
async-imap = "0.11"
async-native-tls = "0.5"
async-std = { version = "1", features = ["attributes"] }
futures = "0.3"
mailparse = "0.15"
icalendar = "0.17"
chrono-tz = "0.10"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
html2text = { version = "0.14", features = ["css"] }
log = "0.4"
simplelog = "0.12"
time = { version = "0.3", features = ["macros"] }
ratatui = "0.29"
crossterm = "0.28"
arboard = "3"
nucleo-matcher = "0.3"
regex = "1"
serde_json = "1"
base64 = "0.22"
# Percent-encoding for `/$batch` sub-request URLs, which Graph parses itself
# rather than letting `reqwest`'s `Url` escape them (#0065). Already in the
# lockfile via `reqwest` -> `url`.
percent-encoding = "2"
unicode-width = "0.2"
# Advisory `flock` for the single-engine-per-account lock (#0061, folded into
# #0039). Already in the lockfile transitively; promoted to a direct dep for
# the one `flock` call in src/engine_lock.rs. Unix only, which is fine: Windows
# is targeted through WSL, where this is a Linux binary.
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Bundled SQLite (compiled from source, FTS5 enabled): the store engine must not
# depend on a system libsqlite, including on the musl release target.
rusqlite = { version = "0.32", features = ["bundled"] }
# Only used to enable the `vendored` feature for static musl release builds
# (see .github/workflows/release.yml). Not compiled in default builds.
openssl = { version = "0.10", optional = true }
# Workspace crates. Unconditional dependencies so the root `tests/` can
# `use mp_protocol::…` / `use mp_client::…`; neither depends on `mailypoppins`.
mp-protocol = { path = "crates/mp-protocol" }
mp-client = { path = "crates/mp-client" }

[features]
# Statically link OpenSSL (built from source). Required for the
# x86_64-unknown-linux-musl release target, where no system OpenSSL exists.
vendored-openssl = ["openssl/vendored"]
# Gate for daemon code and its contract tests during the migration
# (.agents/workflow/native-gui-daemon/plan.md section 3.0). Removed in P4-U1.
daemon = []

[dev-dependencies]
tempfile = "3"
insta = "1.39"

# Daemon contract tests. Cargo skips a target whose `required-features` are
# unmet, so plain `cargo test` compiles and passes unchanged while these files
# reference `mp_protocol` items that do not exist yet
# (.agents/workflow/native-gui-daemon/plan.md section 3.0). Declaring targets
# explicitly does not disable autodiscovery of the other `tests/*.rs` files.
[[test]]
name = "daemon_protocol_fixtures"
path = "tests/daemon_protocol_fixtures.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_framing"
path = "tests/daemon_framing.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_runtime_paths"
path = "tests/daemon_runtime_paths.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_lifecycle"
path = "tests/daemon_lifecycle.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_handshake"
path = "tests/daemon_handshake.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_read_only_methods"
path = "tests/daemon_read_only_methods.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_dispatcher"
path = "tests/daemon_dispatcher.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_bootstrap"
path = "tests/daemon_bootstrap.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_events"
path = "tests/daemon_events.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_operations"
path = "tests/daemon_operations.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_account_runtime"
path = "tests/daemon_account_runtime.rs"
required-features = ["daemon"]

[[test]]
name = "daemon_sync_outcome"
path = "tests/daemon_sync_outcome.rs"
required-features = ["daemon"]
